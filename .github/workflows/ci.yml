name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check out the pinned upstream runtime
        uses: actions/checkout@v6
        with:
          repository: dataelement/dsh-desktop
          ref: 46666d34277571a7b48ada6060a9428ee503b136
          path: .upstream
          persist-credentials: false
      - name: Verify upstream modules and reviewed patches
        run: node scripts/check-upstream.mjs .upstream
      - name: Check generated files
        run: git diff --exit-code -- lib/client.js lib/catalog.js lib/preview-manifest.js
      - run: npm pack --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
