name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Select a release tag to publish');
          assert.match(version, /^\d+\.\d+\.\d+$/, 'Only stable versions publish to latest');
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Tag must match package.json');
          NODE
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - name: Check generated files
        run: git diff --exit-code -- lib/client.js lib/catalog.js lib/preview-manifest.js
      - name: Pack release
        id: package
        run: |
          npm pack --json > "$RUNNER_TEMP/dsh-ppt-pack.json"
          package_file=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dsh-ppt-pack.json', 'utf8'))[0].filename")
          echo "tarball=$package_file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
      - name: Publish with npm trusted publishing
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance

