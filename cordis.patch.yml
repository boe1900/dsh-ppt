# Legacy on-disk directory retained to preserve existing user projects.
# Installable DSH PPTD bundle. The feature remains outside the
# shipped Web roster until a profile explicitly adds this package.
- insert:
    - id: dsh-ppt
      name: '@cola1900/dsh-ppt'
      config:
        root: !!js dshHomePath('kimi-ppt')
        presetRoot: !!js dshHomePath('.agent-presets')
